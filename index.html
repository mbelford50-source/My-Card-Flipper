<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production Deck Flipper</title>
  <style>
    :root {
      /* Locked to your custom landscape specs */
      --card-w: 255px;
      --card-h: 350px;
    }
    body {
      background-color: #1e272e;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    .control-panel {
      background: #2f3542;
      padding: 15px 25px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    button {
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-shuffle { background-color: #05c46b; }
    .btn-shuffle:hover { background-color: #04a75b; }
    .btn-reset { background-color: #ff5252; }
    .btn-reset:hover { background-color: #ff3838; }
    
    .game-container {
      display: flex;
      justify-content: center;
      gap: 40px;
      max-width: 100%;
      margin: 0 auto;
      flex-wrap: wrap;
    }
    .side-panel {
      background: #2f3542;
      padding: 20px;
      border-radius: 12px;
      min-width: calc((var(--card-w) * 2) + 80px); 
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
    .pile-title { margin-top: 0; color: #ffa502; font-size: 20px; }
    .card-slots {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: 20px;
      gap: 25px;
    }
    .slot-label { font-size: 12px; color: #a4b0be; margin-bottom: 5px; }
    
    .card-space { 
      width: var(--card-w); 
      height: var(--card-h); 
      position: relative;
    }
    .deck-pile {
      background: #747d8c;
      border: 3px dashed #a4b0be;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      transform-style: preserve-3d;
      transition: transform 0.3s ease, margin-left 0.3s ease, z-index 0.1s; 
    }
    .card.flipped { transform: rotateY(180deg); }
    
    .shuffling {
      animation: shuffleMotion 0.4s ease alternate 2;
    }
    @keyframes shuffleMotion {
      0% { transform: translateX(0) rotate(0deg); }
      50% { transform: translateX(30px) rotate(3deg) scale(1.03); }
      100% { transform: translateX(-30px) rotate(-3deg) scale(0.97); }
    }

    .card-face {
      position: absolute;
      width: 100%; height: 100%;
      backface-visibility: hidden;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }
    .card-back { background: #57606f; }
    .card-front { transform: rotateY(180deg); background: white; }
    .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    
    .discard-pile {
      border: 2px dashed #57606f;
      border-radius: 8px;
      background: rgba(0,0,0,0.2);
    }
    .discard-pile:hover .card:nth-child(2) { margin-left: -25px; transform: rotateY(180deg) rotate(-4deg); }
    .discard-pile:hover .card:nth-child(3) { margin-left: -50px; transform: rotateY(180deg) rotate(-2deg); }
    .discard-pile:hover .card:nth-child(4) { margin-left: -75px; transform: rotateY(180deg) rotate(0deg); }
    .discard-pile:hover .card:nth-child(5) { margin-left: -100px; transform: rotateY(180deg) rotate(2deg); }
    .discard-pile:hover .card:nth-child(6) { margin-left: -125px; transform: rotateY(180deg) rotate(4deg); }
    .discard-pile .card:last-child { z-index: 10; } 

    .count { font-size: 14px; margin-top: 15px; color: #ced6e0; }

    /* Dedicated Button Styles for Safe Card Flipping Layouts */
    .btn-action-flip {
      background-color: #ffa502;
      color: #1e272e;
      margin-top: 10px;
      padding: 6px 16px;
      font-size: 12px;
      width: 100%;
    }
    .btn-action-flip:hover { background-color: #eccc68; }

    /* New Discard History Panel Styles at Bottom */
    .history-panel {
      background: #2f3542;
      padding: 20px;
      border-radius: 12px;
      max-width: 600px;
      margin: 40px auto 0 auto;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
    .history-title { margin-top: 0; color: #ffa502; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
    .history-list {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 12px;
      list-style-type: none;
      margin: 0;
      background: rgba(0,0,0,0.25);
      border-radius: 8px;
      min-height: 50px;
      align-items: center;
    }
    .history-item {
      background: #ffffff;
      color: #2f3542;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      white-space: nowrap;
      box-shadow: 0 3px 6px rgba(0,0,0,0.15);
      border-left: 5px solid #ff4757;
    }
    .history-item.side-right { border-left-color: #05c46b; }
  
    /* MOBILE TOUCH SCREEN OPTIMIZATIONS */
    @media (max-width: 768px) {
      :root {
        /* Scales card dimensions down smoothly for mobile frames */
        --card-w: 130px;
        --card-h: 180px;
      }
      body {
        padding: 10px;
      }
      .control-panel {
        flex-wrap: wrap;
        gap: 10px;
        padding: 10px;
        width: 100%;
        box-sizing: border-box;
      }
      button {
        padding: 8px 16px;
        font-size: 12px;
        flex: 1 1 40%;
      }
      .side-panel {
        min-width: 100%;
        padding: 10px;
        box-sizing: border-box;
      }
      .card-slots {
        gap: 10px;
      }
      /* Adjusts fanned hover explode intervals for smaller specs */
      .discard-pile:hover .card:nth-child(2) { margin-left: -12px; }
      .discard-pile:hover .card:nth-child(3) { margin-left: -24px; }
      .discard-pile:hover .card:nth-child(4) { margin-left: -36px; }
      .discard-pile:hover .card:nth-child(5) { margin-left: -48px; }
      .discard-pile:hover .card:nth-child(6) { margin-left: -60px; }
    }</style>
</head>
<body>

  <h1>Production Deck Flipper</h1>

    <div class="control-panel">
    <button class="btn-shuffle" onclick="triggerShuffleAnimation()">Shuffle & Split Deck</button>
    <button class="btn-reset" onclick="resetBoard()">Reset Game</button>
    
    <!-- New JSON Interface Control Triggers -->
    <button style="background-color: #3498db;" onclick="exportToJSON()">📤 Export Game (JSON)</button>
    <button style="background-color: #9b59b6;" onclick="triggerJSONImport()">📥 Import Game (JSON)</button>
    <input type="file" id="json-file-input" accept=".json" onchange="importFromJSON(event)" style="display: none;">
  </div>


  <div class="game-container">
    <!-- Left Pile -->
    <div class="side-panel">
      <h2 class="pile-title">Pile A (Left)</h2>
      <div class="card-slots">
        <div>
          <div class="slot-label">Draw Slot</div>
          <div id="left-draw" class="card-space deck-pile" onclick="drawCard('left')"></div>
          <button class="btn-action-flip" onclick="flipActiveCard('left')">🔄 Flip Card</button>
        </div>
        <div>
          <div class="slot-label">Discard (Hover Me)</div>
          <div id="left-discard" class="card-space discard-pile"></div>
        </div>
      </div>
      <div id="left-count" class="count">Cards left: 0</div>
    </div>

    <!-- Right Pile -->
    <div class="side-panel">
      <h2 class="pile-title">Pile B (Right)</h2>
      <div class="card-slots">
        <div>
          <div class="slot-label">Draw Slot</div>
          <div id="right-draw" class="card-space deck-pile" onclick="drawCard('right')"></div>
          <button class="btn-action-flip" onclick="flipActiveCard('right')">🔄 Flip Card</button>
        </div>
        <div>
          <div class="slot-label">Discard (Hover Me)</div>
          <div id="right-discard" class="card-space discard-pile"></div>
        </div>
      </div>
      <div id="right-count" class="count">Cards left: 0</div>
    </div>
  </div>

  <!-- Discard History UI Feed Grid -->
  <div class="history-panel">
    <h3 class="history-title">Discard Log History</h3>
    <ul id="history-list" class="history-list">
      <li id="history-placeholder" style="color: #a4b0be; font-style: italic; list-style: none; width: 100%;">No cards discarded yet.</li>
    </ul>
  </div>
    <script>
    let state = {
      left: { draw: [], active: null, discard: [] },
      right: { draw: [], active: null, discard: [] }
    };
    
    let initialDrawState = { left: [], right: [] };
    let discardHistoryLog = []; 

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function triggerShuffleAnimation() {
      const leftPileCard = document.querySelector('#left-draw .card');
      const rightPileCard = document.querySelector('#right-draw .card');
      
      if (leftPileCard) leftPileCard.classList.add('shuffling');
      if (rightPileCard) rightPileCard.classList.add('shuffling');
      
      setTimeout(() => {
        initializeDeck();
      }, 600);
    }

    function initializeDeck() {
      let dynamicDeckList = [];
      for (let i = 1; i <= 64; i++) {
        dynamicDeckList.push(`${i}.png`);
      }

      const shuffled = shuffle([...dynamicDeckList]);
      
      state.left = { draw: shuffled.slice(0, 32), active: null, discard: [] };
      state.right = { draw: shuffled.slice(32, 64), active: null, discard: [] };
      
      initialDrawState.left = [...state.left.draw];
      initialDrawState.right = [...state.right.draw];
      
      discardHistoryLog = [];
      document.getElementById('left-discard').innerHTML = '';
      document.getElementById('right-discard').innerHTML = '';
      clearHistoryUI();
      
      renderDrawPiles();
    }

    function resetBoard() {
      state.left = { draw: [...initialDrawState.left], active: null, discard: [] };
      state.right = { draw: [...initialDrawState.right], active: null, discard: [] };
      
      discardHistoryLog = [];
      document.getElementById('left-discard').innerHTML = '';
      document.getElementById('right-discard').innerHTML = '';
      clearHistoryUI();
      
      renderDrawPiles();
    }

    function clearHistoryUI() {
      document.getElementById('history-list').innerHTML = '<li id="history-placeholder" style="color: #a4b0be; font-style: italic; list-style: none; width: 100%;">No cards discarded yet.</li>';
    }

    function renderDrawPiles() {
      ['left', 'right'].forEach(side => {
        const drawSpace = document.getElementById(`${side}-draw`);
        const countText = document.getElementById(`${side}-count`);
        drawSpace.innerHTML = '';
        countText.innerText = `Cards left: ${state[side].draw.length}`;

        if (state[side].draw.length > 0 || state[side].active !== null) {
          let cardHtml = `
            <div class="card" id="${side}-current-card">
              <div class="card-face card-back">
                <img src="img/card-back.png" alt="Back">
              </div>
              <div class="card-face card-front">
                <img src="img/${state[side].active !== null ? state[side].active : 'card-back.png'}" alt="Front">
              </div>
            </div>
          `;
          
          if (state[side].active === null) {
            cardHtml = `
              <div class="card">
                <div class="card-face card-back">
                  <img src="img/card-back.png" alt="Back">
                </div>
              </div>
            `;
          }
          drawSpace.innerHTML = cardHtml;
        } else {
          drawSpace.innerHTML = '<span style="color:#57606f;font-size:12px;">Empty</span>';
        }
      });
    }

    function drawCard(side) {
      const current = state[side];
      
      if (current.active !== null) {
        current.discard.push(current.active);
        discardHistoryLog.push({ side: side, value: current.active.replace('.png', '') });
        updateHistoryUI();
        renderDiscardPile(side);
        current.active = null;
      }

      if (current.draw.length > 0) {
        current.active = current.draw.shift();
      }
      
      renderDrawPiles();
    }

    function flipActiveCard(side) {
      if (state[side].active === null) return;
      const cardElement = document.getElementById(`${side}-current-card`);
      if (cardElement) {
        cardElement.classList.toggle('flipped');
      }
    }

    function renderDiscardPile(side) {
      const discardSpace = document.getElementById(`${side}-discard`);
      discardSpace.innerHTML = '';
      
      const visibleDiscards = state[side].discard.slice(-6);
      
      visibleDiscards.forEach(cardImg => {
        const cardHtml = `
          <div class="card flipped">
            <div class="card-face card-back">
              <img src="img/card-back.png" alt="Back">
            </div>
            <div class="card-face card-front">
              <img src="img/${cardImg}" alt="CardFront">
            </div>
          </div>
        `;
        discardSpace.insertAdjacentHTML('beforeend', cardHtml);
      });
    }

    function updateHistoryUI() {
      const historyList = document.getElementById('history-list');
      const placeholder = document.getElementById('history-placeholder');
      if (placeholder) placeholder.remove();
      
      historyList.innerHTML = '';
      
      discardHistoryLog.forEach(entry => {
        const li = document.createElement('li');
        li.className = `history-item ${entry.side === 'right' ? 'side-right' : ''}`;
        li.innerText = `Pile ${entry.side === 'left' ? 'A' : 'B'}: Card ${entry.value}`;
        historyList.appendChild(li);
      });

      historyList.scrollLeft = historyList.scrollWidth;
    }

    // ===============================================================
    // JSON IMPORT & EXPORT FEATURES
    // ===============================================================
    
    function exportToJSON() {
      // Pack current game state and tracking items into a single object
      const dataStr = JSON.stringify({
        state: state,
        initialDrawState: initialDrawState,
        discardHistoryLog: discardHistoryLog
      }, null, 2);
      
      // Create a temporary downloadable data link block
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      
      link.href = url;
      link.download = "deck_flipper_save.json";
      document.body.appendChild(link);
      link.click();
      
      // Clean up memory paths
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function triggerJSONImport() {
      document.getElementById('json-file-input').click();
    }

    function importFromJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          
          // Re-assign states from the JSON save file properties
          state = importedData.state;
          initialDrawState = importedData.initialDrawState;
          discardHistoryLog = importedData.discardHistoryLog;
          
          // Force screen UI graphics update re-render loop
          renderDrawPiles();
          renderDiscardPile('left');
          renderDiscardPile('right');
          updateHistoryUI();
          
          alert("Game state loaded successfully!");
        } catch (err) {
          alert("Error: Invalid or corrupted JSON save file.");
        }
      };
      reader.readAsText(file);
    }

    initializeDeck();
  </script>
</body>
</html>
